# Integración continua: compila y corre los tests en cada push y pull request.
name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar y ejecutar tests
        run: mvn -B verify

      - name: Guardar reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
